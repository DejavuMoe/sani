# One grouped pull request per ecosystem, so updates arrive in a few reviews
# rather than a stream. Major versions change the toolchain (TypeScript, or
# Node, whose version mise.toml pins) and are upgraded by hand, as are the
# versions in mise.toml.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /
      - /.agents/skills/baoyu-design/agents/gen-pptx
      - /.agents/skills/baoyu-design/agents/gen-video
    schedule:
      interval: monthly
    groups:
      web-and-docs:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
