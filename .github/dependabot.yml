version: 2
updates:
  # Refresh pinned runtime/builder digests through reviewed, tested PRs.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ['*']
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/setup', '/.github/actions/download-build']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
