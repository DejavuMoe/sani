name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a new advisory or a broken upstream shows up without a commit.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Shared application build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make build VERSION="ci-${GITHUB_SHA::7}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8e374df55bdbd4a45353c1f6eeec2bfc3a671635
          path: .upgrade-legacy
      - run: make -C .upgrade-legacy install build RUN=
      # tar preserves executable bits and the hidden legacy directory.
      - run: tar -cf "$RUNNER_TEMP/build.tar" bin/sani internal/webui/dist .upgrade-legacy/bin/sani
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ github.sha }}
          path: ${{ runner.temp }}/build.tar
          compression-level: 1
          retention-days: 7

  dependency-graph:
    name: Dependency graph (${{ matrix.manifest }})
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - manifest: web/package.json
            manager: pnpm
          - manifest: docs/package.json
            manager: pnpm
          - manifest: .agents/skills/baoyu-design/agents/gen-pptx/package.json
            manager: npm
            lockfile: .agents/skills/baoyu-design/agents/gen-pptx/package-lock.json
          - manifest: .agents/skills/baoyu-design/agents/gen-video/package.json
            manager: npm
            lockfile: .agents/skills/baoyu-design/agents/gen-video/package-lock.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.2
          install_args: node pnpm
      # Let the package managers resolve catalogs, patches and multi-document locks.
      - name: Export locked dependencies without installing packages
        env:
          MANIFEST: ${{ matrix.manifest }}
          MANAGER: ${{ matrix.manager }}
        run: |
          directory="${MANIFEST%/*}"
          if [ "$MANAGER" = pnpm ]; then
            pnpm --filter "./$directory" sbom --sbom-format spdx --lockfile-only > "$RUNNER_TEMP/dependencies.spdx.json"
          else
            npm --prefix "$directory" sbom --sbom-format spdx --package-lock-only > "$RUNNER_TEMP/dependencies.spdx.json"
          fi
          node scripts/prepare-sbom.mjs "$RUNNER_TEMP/dependencies.spdx.json"
      - uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: ${{ runner.temp }}
          filePattern: dependencies.spdx.json
          manifestPath: ${{ matrix.manifest }}
          correlator: dependency-graph-${{ matrix.manifest }}
      # Both tracked manifests keep their snapshots, using one locked export.
      - if: matrix.manager == 'npm'
        uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: ${{ runner.temp }}
          filePattern: dependencies.spdx.json
          manifestPath: ${{ matrix.lockfile }}
          correlator: dependency-graph-${{ matrix.lockfile }}

  check:
    name: Check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # gofmt, go vet, svelte-check, the docs sync check and vue-tsc.
      - run: make check
      - run: make test
      - run: bash scripts/test-release-notes.sh
      - name: Capacity and count consistency
        run: |
          sizes=1000
          if [ "${{ github.event_name }}" = schedule ]; then sizes=1000,10000,100000; fi
          go run ./scripts/capacity -sizes "$sizes" > capacity.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capacity-${{ github.sha }}
          path: capacity.json
          retention-days: 7

  go:
    name: Go tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  e2e:
    name: End-to-end and accessibility
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - uses: ./.github/actions/download-build
      - run: pnpm --dir web e2e
      - name: axe over the admin app
        run: |
          go run ./scripts/seed -data "$RUNNER_TEMP/demo" -password sani-demo -icons=false
          SANI_LISTEN=127.0.0.1:18080 SANI_DATA_DIR="$RUNNER_TEMP/demo" ./bin/sani &
          SANI_LISTEN=127.0.0.1:18081 SANI_DATA_DIR="$RUNNER_TEMP/fresh" ./bin/sani &
          for port in 18080 18081; do
            timeout 30 sh -c "until curl -fs http://127.0.0.1:$port/healthz >/dev/null; do sleep 0.5; done"
          done
          SANI_URL=http://127.0.0.1:18080 SANI_FRESH_URL=http://127.0.0.1:18081 pnpm --dir web a11y
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: web/test-results
          retention-days: 7

  api-contract:
    name: HTTP contract and snapshot rollback
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - uses: ./.github/actions/download-build
      - run: node scripts/smoke.mjs
      - run: OLD_BIN=.upgrade-legacy/bin/sani node scripts/api-contract.mjs --upgrade

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make docs
      - name: Verify docs output and atomic publishing
        run: |
          sh scripts/verify-docs-output.sh docs/.vitepress/dist
          sh scripts/test-publish-docs.sh
      - run: pnpm --dir docs exec playwright install --with-deps chromium
      - name: axe over every page, both languages and themes
        run: |
          pnpm --dir docs preview &
          timeout 30 sh -c 'until curl -fs http://127.0.0.1:4174/ >/dev/null; do sleep 0.5; done'
          pnpm --dir docs a11y

  image:
    name: Docker image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Every platform the release publishes, so a Dockerfile change that
      # breaks one of them fails here and not at release time.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=ci
          cache-from: type=gha,scope=sani-image
          cache-to: type=gha,scope=sani-image,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sani:ci
          build-args: VERSION=ci
          cache-from: type=gha,scope=sani-image
      - uses: ./.github/actions/download-build
      - name: Upgrade and rollback on non-root Docker bind storage
        run: |
          docker image inspect -f 'image size: {{.Size}} bytes' sani:ci
          bash scripts/test-docker-storage.sh sani:ci .upgrade-legacy/bin/sani

  dist:
    name: Release archives
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - uses: ./.github/actions/download-build
      - run: make dist VERSION="ci-${GITHUB_SHA::7}"
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sani-${{ github.sha }}
          path: dist
          retention-days: 7

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Audit web, docs and tracked design tools
        run: |
          pnpm audit --audit-level=moderate
          for tool in gen-pptx gen-video; do
            npm --prefix ".agents/skills/baoyu-design/agents/$tool" audit --audit-level=moderate
          done
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The action defaults to "stable", which would win over the file.
          go-version-input: ""
          go-version-file: go.mod
          # Checkout and Go caches are already handled by the setup above.
          repo-checkout: false
          cache: false
          check-latest: false
