name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a new advisory or a broken upstream shows up without a commit.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # gofmt, go vet, svelte-check, the docs sync check and vue-tsc.
      - run: make check
      - run: make test
      - name: Capacity and count consistency
        run: |
          sizes=1000
          if [ "${{ github.event_name }}" = schedule ]; then sizes=1000,10000,100000; fi
          go run ./scripts/capacity -sizes "$sizes" > capacity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-${{ github.sha }}
          path: capacity.json
          retention-days: 7

  go:
    name: Go tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make e2e
      - run: make smoke
      - name: axe over the admin app
        run: |
          go run ./scripts/seed -data "$RUNNER_TEMP/demo" -password sani-demo -icons=false
          SANI_LISTEN=127.0.0.1:18080 SANI_DATA_DIR="$RUNNER_TEMP/demo" ./bin/sani &
          SANI_LISTEN=127.0.0.1:18081 SANI_DATA_DIR="$RUNNER_TEMP/fresh" ./bin/sani &
          for port in 18080 18081; do
            timeout 30 sh -c "until curl -fs http://127.0.0.1:$port/healthz >/dev/null; do sleep 0.5; done"
          done
          SANI_URL=http://127.0.0.1:18080 SANI_FRESH_URL=http://127.0.0.1:18081 pnpm --dir web a11y
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make docs
      - name: Verify docs output and atomic publishing
        run: |
          sh scripts/verify-docs-output.sh docs/.vitepress/dist
          sh scripts/test-publish-docs.sh
      - run: pnpm --dir docs exec playwright install --with-deps chromium
      - name: axe over every page, both languages and themes
        run: |
          pnpm --dir docs preview &
          timeout 30 sh -c 'until curl -fs http://127.0.0.1:4174/ >/dev/null; do sleep 0.5; done'
          pnpm --dir docs a11y

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Every platform the release publishes, so a Dockerfile change that
      # breaks one of them fails here and not at release time.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: sani:ci
          build-args: VERSION=ci
          cache-from: type=gha
      - name: Start the image and wait for its health check
        run: |
          docker image inspect -f 'image size: {{.Size}} bytes' sani:ci
          docker run -d --name sani -p 127.0.0.1:8080:8080 sani:ci
          # The inner shell expands this command.
          # shellcheck disable=SC2016
          timeout 60 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" sani)" = healthy ]; do sleep 1; done'
          docker exec sani /sani version
          docker logs sani 2>&1 | grep -q setup_code

  dist:
    name: Release archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make web dist VERSION="ci-${GITHUB_SHA::7}"
      - run: cat dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sani-${{ github.sha }}
          path: dist
          retention-days: 7

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Audit web, docs and tracked design tools
        run: |
          pnpm audit --audit-level=moderate
          for tool in gen-pptx gen-video; do
            npm --prefix ".agents/skills/baoyu-design/agents/$tool" audit --audit-level=moderate
          done
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The action defaults to "stable", which would win over the file.
          go-version-input: ""
          go-version-file: go.mod
          # Checkout and Go caches are already handled by the setup above.
          repo-checkout: false
          cache: false
          check-latest: false
