name: Download CI build
description: Restore the current commit's web assets and executable permissions.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-${{ github.sha }}
        path: ${{ runner.temp }}/sani-build
    - shell: bash
      run: tar -xf "$RUNNER_TEMP/sani-build/build.tar"
