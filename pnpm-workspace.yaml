# The admin app and the documentation site. The Go module lives at the root.
packages:
  - web
  - docs

# Dependency install scripts stay off. esbuild (under the docs site's Vite)
# gets its binary from an optional dependency; its script only re-checks it.
allowBuilds:
  esbuild: false

# VitePress 1.x still requests Vite 5. Use the patched Vite 6 line supported
# by its Vue plugin; remove this override when VitePress updates its range.
overrides:
  'vitepress>vite': ^6.4.3

# VitePress 1.6.4 preview ignores --host; keep local previews on loopback.
patchedDependencies:
  vitepress@1.6.4: patches/vitepress@1.6.4.patch

# Versions both packages use, so the docs render with the app's own fonts.
catalog:
  '@fontsource-variable/inter': 5.3.0
  '@fontsource/ibm-plex-mono': 5.3.0
  '@playwright/test': 1.63.0
  '@types/node': 24.19.1
  axe-core: 4.13.0
  typescript: 6.0.3
