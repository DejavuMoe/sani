# Run Sani with SANI_TRUST_PROXY=true behind this proxy. To share files, add
# the files domain (SANI_FILES_URL) to both server_name lines and to the
# certificate: certbot certonly -d s.example.com -d f.example.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s.example.com;

    ssl_certificate     /etc/letsencrypt/live/s.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s.example.com/privkey.pem;

    # Imports take up to 32 MiB; chunk requests take at most 25 MB.
    # 100m also covers the default 99 MB legacy single-request upload;
    # uploads go straight through to Sani instead of a temporary file.
    client_max_body_size 100m;
    proxy_request_buffering off;
    client_body_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name s.example.com;
    return 301 https://$host$request_uri;
}
