services:
  sani:
    # Keep the full release tag, including v. To build from a checkout,
    # replace this line with `build: .`
    image: ghcr.io/dejavumoe/sani:v0.9.0
    container_name: sani
    restart: unless-stopped
    stop_grace_period: 30s
    # Localhost only: put a TLS reverse proxy in front (see deploy/).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Shanghai # days in the stats follow this zone
      SANI_BASE_URL: https://s.example.com # the domain your short links use
      SANI_TRUST_PROXY: "true" # the proxy sets X-Forwarded-* headers
      # SANI_FILES_URL: https://f.example.com # a second domain for shared files, also served by the proxy
      # SANI_PASSWORD: change-me # optional; otherwise pick one on first visit with the setup code from `docker logs sani`
      # SANI_ROOT_REDIRECT: https://example.com # where the bare domain goes
    volumes:
      # Before first start: sudo install -d -m 750 -o 65532 -g 65532 ./sani-data
      - type: bind
        source: ./sani-data
        target: /data
        bind:
          create_host_path: false
